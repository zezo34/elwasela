/* Layout: atlas-style two-tab shell. Terrain tab = 3D stage + info panel; Rocks tab = card index + specimen sheet. */
:root{

}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E181A;--surface:#152426;--ink:#E3EEEC;--muted:#8FA6A9;--line:#294043;
    --accent:#4FC3CB;--accent-ink:#06191B;--soft:#193235;--mark:#E3A650;
    --stage1:#1C3235;--stage2:#0B1618;

  }

:root[data-theme="dark"]{
  --bg:#0E181A;--surface:#152426;--ink:#E3EEEC;--muted:#8FA6A9;--line:#294043;
  --accent:#4FC3CB;--accent-ink:#06191B;--soft:#193235;--mark:#E3A650;
  --stage1:#1C3235;--stage2:#0B1618;

  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);font:400 15px/1.75 var(--fb);direction:rtl;
  padding-block:18px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--fd);font-weight:600;text-wrap:balance}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto}

.top{display:flex;align-items:center;gap:14px;padding-bottom:14px;flex-wrap:wrap}
.logo{width:54px;height:54px;flex:none;color:var(--accent)}
.top h1{font-size:34px;line-height:1.2}
.top .sub{color:var(--muted);font-size:14px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:10px 18px;
  font:600 18px var(--fd);color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}

.t-grid{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:16px;margin-top:16px;align-items:start}
.stage{position:relative;direction:ltr;height:min(66vh,600px);min-height:380px;border:1px solid var(--line);border-radius:14px;overflow:hidden;
  background:radial-gradient(120% 95% at 50% 15%,var(--stage1),var(--stage2));touch-action:pan-y;cursor:grab}
.stage canvas{display:block;width:100%;height:100%}
.tlabel{position:absolute;left:0;top:0;direction:rtl;background:var(--surface);color:var(--ink);border:1px solid var(--line);
  border-radius:999px;padding:2px 12px;font:600 13px/1.6 var(--fb);box-shadow:0 2px 8px rgba(0,0,0,.18);white-space:nowrap;will-change:transform}
.tlabel:hover,.tlabel[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hint{position:absolute;inset-inline:0;bottom:10px;direction:rtl;text-align:center;font-size:12.5px;color:var(--muted);pointer-events:none}
.fail{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted);direction:rtl}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-top:10px;font-size:14px}
.ctrl label{display:flex;align-items:center;gap:8px;color:var(--muted)}
.ctrl input[type=range]{accent-color:var(--accent);width:130px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 14px;font-weight:500}

.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}

.note{color:var(--muted);font-size:12.5px;margin-inline-start:auto}

.panel h2{font-size:26px;line-height:1.3}

.feat-list{display:grid;gap:8px;margin-top:12px}

.feat:hover{border-color:var(--accent)}

dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:12px 0 0}
dt{color:var(--muted);font-size:13.5px}
dd{margin:0;font-weight:500}

.rcard b{display:block;font:600 16px var(--fd);margin-top:6px}

.rcard:hover{border-color:var(--accent)}

.rk-big{display:block;width:100%;max-height:240px;aspect-ratio:1;object-fit:cover;border-radius:10px;margin-bottom:12px}
.pill{display:inline-block;background:var(--soft);color:var(--ink);border-radius:999px;padding:0 12px;font-size:13px;font-weight:600;margin-top:6px}
.meter{position:relative;direction:ltr;height:8px;background:var(--soft);border-radius:4px;margin-top:6px}
.meter i{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:4px}
.meter-n{direction:ltr;display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}

.quiz{max-width:760px;margin:18px auto 0}
.qbar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--accent)}
.qmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-top:8px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:12px}
.qcard h2{font-size:21px;line-height:1.5}
.qimg{display:block;width:min(100%,260px);aspect-ratio:1;object-fit:cover;border-radius:12px;margin:12px 0}
.qclue{background:var(--soft);border-radius:10px;padding:12px 14px;margin:12px 0;font-size:16px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:8px}
.opt{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font:600 16px var(--fd);text-align:start}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.ok{background:var(--goodbg);border-color:var(--good);color:var(--ink)}
.opt.no{background:var(--badbg);border-color:var(--bad);color:var(--ink)}

.fb{margin-top:14px;border-radius:10px;padding:12px 14px;font-size:14.5px}
.fb.ok{background:var(--goodbg)}.fb.no{background:var(--badbg)}
.fb strong{display:block;font:600 17px var(--fd)}
.score{font:700 54px/1.1 var(--fd);color:var(--accent)}
.miss{display:flex;gap:10px;align-items:center;margin-top:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.miss img{width:44px;height:44px;border-radius:6px;object-fit:cover}

.chip.big{font:600 17px var(--fd);padding:6px 20px;flex:1 1 auto;text-align:center}
.qbtns{display:flex;gap:8px;flex-wrap:wrap;margin-inline-start:auto}
@media (max-width:900px){
  .t-grid,.rk{grid-template-columns:minmax(0,1fr)}

}
@media (max-width:640px){
  .steps{display:flex;overflow-x:auto;gap:8px;padding-bottom:6px}

  .tab{font-size:16px;padding:8px 12px}
  .note,.qbtns{margin-inline-start:0;width:100%}
  .qbtns .btn{flex:1}
  .panel{padding:14px}
}
@media (max-width:480px){
  .opts{grid-template-columns:minmax(0,1fr)}
  .top h1{font-size:28px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ======================= توليد التضاريس ======================= */
const hash2=(x,z)=>{const s=Math.sin(x*127.1+z*311.7)*43758.5453;return s-Math.floor(s)};

  val:hex3('#4C8147'),water:hex3('#3F93BA'),top1:hex3('#D2AE70'),top2:hex3('#C39A58'),cliff:hex3('#8E6C42'),mark:hex3('#F2B544')};

function TerrainView({selected,onSelect,exag,auto,onInteract,resetKey,tilt,onTilt}){
  const stage=useRef(null),api=useRef(null),[fail,setFail]=useState(false);
  const cbTilt=useRef(onTilt),cbSel=useRef(onSelect),cbInt=useRef(onInteract),autoRef=useRef(auto),selRef=useRef(selected),exRef=useRef(exag);
  cbSel.current=onSelect;cbInt.current=onInteract;cbTilt.current=onTilt;autoRef.current=auto;selRef.current=selected;exRef.current=exag;
  useEffect(()=>{
    const host=stage.current;let renderer;
    try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:true})}catch(e){setFail(true);return}
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    host.insertBefore(renderer.domElement,host.firstChild);
    const dom=renderer.domElement;
    const scene=new THREE.Scene();
    const camera=new THREE.PerspectiveCamera(40,1,0.1,100);
    scene.add(new THREE.HemisphereLight(0xffffff,0x4a5a66,0.8));
    const sun=new THREE.DirectionalLight(0xfff4e0,0.85);sun.position.set(6,10,5);scene.add(sun);
    const fill=new THREE.DirectionalLight(0xaac4ff,0.25);fill.position.set(-6,4,-5);scene.add(fill);

    const N=150,S=10,V=(N+1)*(N+1);
    const pos=new Float32Array(V*3),col=new Float32Array(V*3),base=new Float32Array(V*3),cls=new Uint8Array(V),H=new Float32Array(V);
    for(let iz=0;iz<=N;iz++)for(let ix=0;ix<=N;ix++){
      const i=iz*(N+1)+ix,x=-S/2+ix*S/N,z=-S/2+iz*S/N,f=sample(x,z);
      pos[i*3]=x;pos[i*3+1]=f.h;pos[i*3+2]=z;H[i]=f.h;cls[i]=f.k;base.set(f.c,i*3);
    }
    col.set(base);
    const idx=[];
    for(let iz=0;iz<N;iz++)for(let ix=0;ix<N;ix++){const a=iz*(N+1)+ix,b=a+1,c=a+N+1,d=c+1;idx.push(a,c,b,b,c,d)}
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
    geo.setAttribute('color',new THREE.BufferAttribute(col,3));
    geo.setIndex(idx);geo.computeVertexNormals();
    const mesh=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.95,metalness:0}));
    const group=new THREE.Group();group.add(mesh);scene.add(group);

    const bands=[[-0.7,-0.45,'#4B3B2D'],[-0.45,-0.2,'#8A6F4E'],[-0.2,0.05,'#6D5640'],[0.05,99,'#94795A']];
    const wp=[],wc=[];
    const edge=(pts)=>{for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1];
      for(const [lo,hi,hc] of bands){
        if(a[1]<=lo&&b[1]<=lo)continue;
        const ya=Math.max(Math.min(a[1],hi),lo),yb=Math.max(Math.min(b[1],hi),lo),c=hex3(hc);
        const q=[[a[0],lo,a[2]],[b[0],lo,b[2]],[b[0],yb,b[2]],[a[0],lo,a[2]],[b[0],yb,b[2]],[a[0],ya,a[2]]];
        for(const v of q){wp.push(v[0],v[1],v[2]);wc.push(c[0],c[1],c[2])}
      }}};
    const line=(fn)=>{const p=[];for(let i=0;i<=N;i++){const j=fn(i);p.push([pos[j*3],pos[j*3+1],pos[j*3+2]])}return p};
    edge(line(i=>N*(N+1)+i));edge(line(i=>i));edge(line(i=>i*(N+1)));edge(line(i=>i*(N+1)+N));
    const wg=new THREE.BufferGeometry();
    wg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(wp),3));
    wg.setAttribute('color',new THREE.BufferAttribute(new Float32Array(wc),3));wg.computeVertexNormals();
    group.add(new THREE.Mesh(wg,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1,side:THREE.DoubleSide})));
    const ped=new THREE.Mesh(new THREE.BoxGeometry(S+0.5,0.16,S+0.5),new THREE.MeshStandardMaterial({color:0x2a2f33,roughness:.8}));
    ped.position.y=-0.78;scene.add(ped);

    const st={theta:0.55,phi:1.0,r:15.5};
    const target=new THREE.Vector3(0,0.5,0);
    const baseR=()=>(host.clientWidth/host.clientHeight<0.9?22:15.5);
    const camPos=()=>{camera.position.set(target.x+st.r*Math.sin(st.phi)*Math.sin(st.theta),target.y+st.r*Math.cos(st.phi),target.z+st.r*Math.sin(st.phi)*Math.cos(st.theta));camera.lookAt(target)};
    const resize=()=>{const w=host.clientWidth,h=host.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()};
    const ro=new ResizeObserver(resize);ro.observe(host);resize();st.r=baseR();

    const setSel=(sel)=>{
      for(let i=0;i<V;i++){
        const k=cls[i];let r=base[i*3],g=base[i*3+1],b=base[i*3+2];
        if(sel!=null){
          if(k===sel){r+=(COL.mark[0]-r)*0.3;g+=(COL.mark[1]-g)*0.3;b+=(COL.mark[2]-b)*0.3}
          else{r*=0.7;g*=0.7;b*=0.7}
        }
        col[i*3]=r;col[i*3+1]=g;col[i*3+2]=b;
      }
      geo.attributes.color.needsUpdate=true;
    };
    const setExag=(e)=>{group.scale.y=e};
    const reset=()=>{st.theta=0.55;st.phi=1.0;st.r=baseR()};
    api.current={setSel,setExag,reset,setTilt:v=>{st.phi=v}};
    setSel(selRef.current);setExag(exRef.current);

    const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
    const pick=(e)=>{const rc=dom.getBoundingClientRect();ndc.set((e.clientX-rc.left)/rc.width*2-1,-((e.clientY-rc.top)/rc.height)*2+1);
      ray.setFromCamera(ndc,camera);const hit=ray.intersectObject(mesh)[0];return hit?sample(hit.point.x,hit.point.z).k:null};
    const ptrs=new Map();let moved=0,pinch=0,drag=false,lastHover=0;
    const dist=()=>{const p=[...ptrs.values()];return Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1])||1};
    const down=e=>{try{dom.setPointerCapture(e.pointerId)}catch(_){}ptrs.set(e.pointerId,[e.clientX,e.clientY]);if(ptrs.size===1)moved=0;drag=true;if(ptrs.size===2)pinch=dist()};
    const move=e=>{
      if(ptrs.has(e.pointerId)){
        const p=ptrs.get(e.pointerId),dx=e.clientX-p[0],dy=e.clientY-p[1];ptrs.set(e.pointerId,[e.clientX,e.clientY]);
        if(ptrs.size===1){st.theta-=dx*0.006;if(e.pointerType!=='touch'){st.phi=clamp(st.phi-dy*0.006,0.2,1.45);cbTilt.current(st.phi)}moved+=Math.abs(dx)+Math.abs(dy);if(moved>6)cbInt.current()}
        else if(ptrs.size===2){const d=dist();st.r=clamp(st.r*pinch/d,6,26);pinch=d;moved+=10;cbInt.current()}
      }else{
        const now=performance.now();if(now-lastHover<70)return;lastHover=now;
        host.style.cursor=pick(e)!=null?'pointer':'grab';
      }
    };
    const up=e=>{const had=ptrs.delete(e.pointerId);drag=ptrs.size>0;if(had&&moved<6&&ptrs.size===0&&e.type==='pointerup'){const k=pick(e);if(k!=null)cbSel.current(k)}};
    const wheel=e=>{e.preventDefault();st.r=clamp(st.r*(1+e.deltaY*0.0012),6,26);cbInt.current()};
    const key=e=>{
      const m={ArrowLeft:()=>st.theta-=0.12,ArrowRight:()=>st.theta+=0.12,ArrowUp:()=>st.phi=clamp(st.phi-0.08,0.2,1.45),ArrowDown:()=>st.phi=clamp(st.phi+0.08,0.2,1.45),'+':()=>st.r=clamp(st.r-1,6,26),'-':()=>st.r=clamp(st.r+1,6,26)}[e.key];
      if(m){e.preventDefault();m();cbTilt.current(st.phi);cbInt.current()}
    };
    dom.addEventListener('pointerdown',down);dom.addEventListener('pointermove',move);dom.addEventListener('pointerup',up);dom.addEventListener('pointercancel',up);
    dom.addEventListener('wheel',wheel,{passive:false});host.addEventListener('keydown',key);

    const labels=[...host.querySelectorAll('.tlabel')],v3=new THREE.Vector3();let raf;
    const loop=()=>{
      raf=requestAnimationFrame(loop);
      if(autoRef.current&&!drag)st.theta+=0.0035;
      camPos();renderer.render(scene,camera);
      const w=host.clientWidth,h=host.clientHeight;
      labels.forEach((el,i)=>{const L=LABELS[i];v3.set(L.x,sample(L.x,L.z).h*group.scale.y+0.3,L.z).project(camera);
        if(v3.z>1){el.style.visibility='hidden';return}
        el.style.visibility='visible';
        el.style.transform='translate('+((v3.x*.5+.5)*w).toFixed(1)+'px,'+((-v3.y*.5+.5)*h).toFixed(1)+'px) translate(-50%,-100%)';
      });
    };
    loop();
    return()=>{cancelAnimationFrame(raf);ro.disconnect();
      dom.removeEventListener('pointerdown',down);dom.removeEventListener('pointermove',move);dom.removeEventListener('pointerup',up);dom.removeEventListener('pointercancel',up);
      dom.removeEventListener('wheel',wheel);host.removeEventListener('keydown',key);
      geo.dispose();wg.dispose();renderer.dispose();if(dom.parentNode)dom.parentNode.removeChild(dom);api.current=null};
  },[]);
  useEffect(()=>{api.current&&api.current.setSel(selected)},[selected]);
  useEffect(()=>{api.current&&api.current.setExag(exag)},[exag]);
  useEffect(()=>{if(resetKey&&api.current)api.current.reset()},[resetKey]);
  useEffect(()=>{api.current&&api.current.setTilt(tilt)},[tilt]);
  return html`<div class="stage" ref=${stage} tabIndex="0" role="application" aria-label="مجسم ثلاثي الأبعاد للتضاريس. استخدم الأسهم للتدوير وعلامتي زائد وناقص للتقريب.">
    ${fail?html`<div class="fail">تعذّر تشغيل العرض ثلاثي الأبعاد في هذا المتصفح. جرّب متصفحًا يدعم WebGL.</div>`:null}
    ${LABELS.map(L=>html`<button key=${L.k} class="tlabel" aria-pressed=${selected===L.k} onClick=${()=>onSelect(L.k)}>${FEATURES[L.k].name}</button>`)}
    <div class="hint">اسحب يمينًا ويسارًا للتدوير · اقرص للتقريب · اضغط على أي شكل</div>
  </div>`;
}

function TerrainTab(){
  const [sel,setSel]=useState(null);
  const [exag,setExag]=useState(1);
  const [auto,setAuto]=useState(!REDUCED);
  const [rk,setRk]=useState(0);
  const [tilt,setTilt]=useState(1);
  const f=sel==null?null:FEATURES[sel];
  return html`<div class="t-grid">
    <div style=${{minWidth:0}}>
      <${TerrainView} selected=${sel} onSelect=${setSel} exag=${exag} auto=${auto} onInteract=${()=>setAuto(false)} resetKey=${rk} tilt=${tilt} onTilt=${setTilt}/>
      <div class="ctrl">
        <label for="exag">تكبير الارتفاعات <input id="exag" type="range" min="0.6" max="2" step="0.1" value=${exag} onChange=${e=>setExag(+e.target.value)}/> <span>${exag.toFixed(1)}×</span></label>
        <label for="tilt">زاوية النظر <input id="tilt" type="range" min="0.3" max="1.45" step="0.05" value=${tilt} onChange=${e=>{setTilt(+e.target.value);setAuto(false)}}/></label>
        <button class="btn" aria-pressed=${auto} onClick=${()=>setAuto(!auto)}>دوران تلقائي</button>
        <button class="btn" onClick=${()=>{setRk(rk+1);setTilt(1);setAuto(false)}}>إعادة الضبط</button>
        <span class="note">مجسم مبسّط للتعليم، والمقاييس غير حقيقية.</span>
      </div>
    </div>
    <aside class="panel" aria-live="polite">
      ${f?html`
        <div style=${{display:'flex',alignItems:'center',gap:'12px'}}>
          <span class="swatch" style=${{background:f.color}}></span>
          <h2>${f.name}<span class="en">${f.en}</span></h2>
        </div>
        <p style=${{marginTop:'10px'}}>${f.def}</p>
        <dl>${f.facts.map(([a,b])=>html`<${React.Fragment} key=${a}><dt>${a}</dt><dd>${b}</dd><//>`)}</dl>
        <h3>كيف تتكوّن؟</h3><p>${f.how}</p>
        <h3>مثال من مصر</h3><p>${f.egypt}</p>
        <div class="fact"><b>هل تعلم؟</b> ${f.know}</div>
        <div class="row-btns">
          <button class="btn pri" onClick=${()=>setSel((sel+1)%4)}>الشكل التالي: ${FEATURES[(sel+1)%4].name}</button>
          <button class="btn" onClick=${()=>setSel(null)}>كل الأشكال</button>
        </div>`
      :html`
        <h2>تضاريس سطح الأرض</h2>
        <p style=${{marginTop:'8px',color:'var(--muted)'}}>دوّر المجسم، ثم اضغط على جبل أو وادٍ أو سهل أو هضبة لتقرأ شرحه وتراه مظللًا على الخريطة.</p>
        <div class="feat-list">
          ${FEATURES.map((x,i)=>html`<button key=${x.key} class="feat" onClick=${()=>setSel(i)}>
            <span class="swatch" style=${{background:x.color}}></span>
            <span><b>${x.name}</b><span class="d">${x.short}</span></span>
          </button>`)}
        </div>`}
    </aside>
  </div>`;
}

function makeQuiz(scope){
  const pool=scope==='all'?ROCKS:ROCKS.filter(r=>groupOfRock(r).id===scope);
  const types=scope==='all'?['img','clue','img','clue','cat','grp']:['img','clue','img','clue','cat'];
  return shuffle(pool).slice(0,10).map(r=>{
    const g=groupOfRock(r),type=pk(Math.random,types);
    if(type==='cat')return{type,r,key:r.cat,opts:CATS.filter(c=>c.group===g.id).map(c=>({key:c.id,label:c.name}))};
    if(type==='grp')return{type,r,key:g.id,opts:GROUPS.map(x=>({key:x.id,label:x.name}))};
    const rest=ROCKS.filter(x=>x.id!==r.id);
    const near=shuffle(rest.filter(x=>x.cat===r.cat))
      .concat(shuffle(rest.filter(x=>x.cat!==r.cat&&groupOfRock(x).id===g.id)))
      .concat(shuffle(rest.filter(x=>groupOfRock(x).id!==g.id)));
    return{type,r,key:r.id,clue:type==='clue'?pk(Math.random,r.clues):null,opts:shuffle([r,...near.slice(0,3)]).map(x=>({key:x.id,label:x.name}))};

  const title=q.type==='img'?'ما اسم هذا الصخر؟':q.type==='clue'?'أي صخر يوافق هذا الوصف؟':q.type==='cat'?'إلى أي نوع ينتمي «'+q.r.name+'»؟':'إلى أي مجموعة ينتمي «'+q.r.name+'»؟';
  return html`<div class="quiz">
    <div class="qbar" role="progressbar" aria-valuemin="0" aria-valuemax=${qs.length} aria-valuenow=${i+1}><i style=${{width:((i+(pick!=null?1:0))/qs.length*100)+'%'}}></i></div>
    <div class="qmeta"><span>${scopeName} · السؤال ${i+1} من ${qs.length}</span><button class="btn" onClick=${onExit}>إنهاء</button></div>
    <div class="qcard">
      <h2>${title}</h2>
      ${q.type==='clue'?html`<div class="qclue">${q.clue}</div>`:html`<img class="qimg" src=${rockImg(q.r)} alt=${q.type==='img'?'عينة صخر للتعرّف عليه':'عينة من '+q.r.name}/>`}
      <div class="opts">${q.opts.map(o=>html`<button key=${o.key} class=${'opt'+(pick!=null?(o.key===q.key?' ok':o.key===pick?' no':''):'')} disabled=${pick!=null} onClick=${()=>answer(o.key)}>${o.label}</button>`)}</div>
      ${pick!=null?html`<div class=${'fb '+(ok?'ok':'no')} aria-live="polite">
        <strong>${ok?'إجابة صحيحة':'الصحيح: '+correctLabel(q)}</strong>${explain(q)}
      </div><div class="row-btns"><button class="btn pri" onClick=${next}>${i+1>=qs.length?'عرض النتيجة':'السؤال التالي'}</button></div>`:null}
    </div></div>`;
}

function RocksTab(){
  const [grpId,setGrp]=useState('sedimentary');
  const [sub,setSub]=useState('all');
  const [selId,setSelId]=useState(ROCKS[0].id);
  const [quiz,setQuiz]=useState(null);
  const det=useRef(null);
  const g=GROUPS.find(x=>x.id===grpId);
  const cats=CATS.filter(c=>c.group===grpId);
  const groupRocks=ROCKS.filter(x=>groupOfRock(x).id===grpId);
  const list=sub==='all'?groupRocks:groupRocks.filter(x=>x.cat===sub);
  const r=ROCKS.find(x=>x.id===selId)||groupRocks[0];
  const rg=groupOfRock(r);
  const chooseGroup=id=>{setGrp(id);setSub('all');setSelId(ROCKS.find(x=>groupOfRock(x).id===id).id)};
  const choose=id=>{setSelId(id);const el=det.current;if(el&&window.innerWidth<=900&&el.getBoundingClientRect().top>window.innerHeight*0.6)el.scrollIntoView({behavior:REDUCED?'auto':'smooth',block:'start'})};
  const open=id=>{const rk=ROCKS.find(x=>x.id===id);setGrp(groupOfRock(rk).id);setSub('all');setSelId(id);setQuiz(null)};
  if(quiz)return html`<${Quiz} key=${quiz} scope=${quiz} onExit=${()=>setQuiz(null)} onOpenRock=${open}/>`;
  return html`<div>
    <div class="cats" role="group" aria-label="مجموعات الصخور" style=${{marginTop:'14px'}}>
      ${GROUPS.map(x=>html`<button key=${x.id} class="chip big" aria-pressed=${x.id===grpId} onClick=${()=>chooseGroup(x.id)}>${x.name}</button>`)}
    </div>
    <ol class="steps" aria-label=${'مراحل تكوّن '+g.name}>
      ${g.steps.map(([a,b])=>html`<li key=${a}><b>${a}</b>${b}</li>`)}
    </ol>
    <div class="cats" role="group" aria-label=${'أنواع '+g.name}>
      <button class="chip" aria-pressed=${sub==='all'} onClick=${()=>setSub('all')}>الكل (${groupRocks.length})</button>
      ${cats.map(c=>html`<button key=${c.id} class="chip" aria-pressed=${sub===c.id} onClick=${()=>setSub(c.id)}>${c.name}</button>`)}
      <div class="qbtns">
        <button class="btn pri" onClick=${()=>setQuiz(grpId)}>اختبر نفسك</button>
        <button class="btn" onClick=${()=>setQuiz('all')}>اختبار شامل</button>
      </div>
    </div>
    <p class="sub-def">${sub==='all'?g.def:catOf(sub).def}</p>
    <div class="rk">
      <div class="rk-list">${list.map(x=>html`<button key=${x.id} class="rcard" aria-pressed=${x.id===r.id} onClick=${()=>choose(x.id)}>
        <img src=${rockImg(x)} alt=${'عينة من '+x.name} loading="lazy"/><b>${x.name}</b><small>${x.en}</small></button>`)}</div>
      <aside class="panel rk-detail" ref=${det} aria-live="polite">
        <img class="rk-big" src=${rockImg(r)} alt=${'عينة من '+r.name}/>
        <h2>${r.name}<span class="en">${r.en}</span></h2>
        <span class="pill">صخر ${rg.single} ${catOf(r.cat).name}</span>
        <dl>
          <dt>الحبيبات</dt><dd>${r.grain}</dd>
          <dt>اللون</dt><dd>${r.color}</dd>
          <dt>الحمض المخفف</dt><dd>${r.acid}</dd>
          <dt>الصلادة (موس)</dt><dd>${r.hard[0]===r.hard[1]?r.hard[0]:r.hard[0]+' إلى '+r.hard[1]}</dd>
        </dl>
        <${Hardness} h=${r.hard}/>
        <h3>كيف تكوّن؟</h3><p>${r.how}</p>
        <h3>الاستخدامات</h3><p>${r.uses}</p>
        <h3>في مصر</h3><p>${r.egypt}</p>
        <div class="row-btns"><button class="btn pri" onClick=${()=>setQuiz(grpId)}>اختبر نفسك</button></div>
      </aside>
    </div>
  </div>`;
}

/* ======================= التطبيق ======================= */
const TABS=[{id:'terrain',name:'التضاريس ثلاثية الأبعاد'},{id:'rocks',name:'معرض الصخور'}];
function Logo(){return html`<svg class="logo" viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
  <path d="M28 4c13 0 24 8 24 22s-9 26-24 26S4 42 4 28 15 4 28 4z"/><path d="M28 11c9 0 17 6 17 16s-7 19-17 19-17-8-17-18 8-17 17-17z"/>
  <path d="M28 18c6 0 10 4 10 10s-4 12-10 12-10-5-10-11 4-11 10-11z"/><path d="M28 25c3 0 4 2 4 4s-2 5-4 5-4-2-4-4 1-5 4-5z" fill="currentColor"/></svg>`}
function App(){
  const read=()=>{const h=location.hash.slice(1);return TABS.some(t=>t.id===h)?h:'terrain'};
  const [tab,setTab]=useState(read);
  useEffect(()=>{const f=()=>setTab(read());window.addEventListener('hashchange',f);return()=>window.removeEventListener('hashchange',f)},[]);
  const go=id=>{setTab(id);try{location.hash=id}catch(e){}};
  return html`<div class="wrap">
    <header class="top"><${Logo}/><div><h1>أطلس الأرض</h1><div class="sub">جغرافيا وجيولوجيا تفاعلية: تضاريس ثلاثية الأبعاد ومعرض للصخور</div></div></header>
    <div class="tabs" role="tablist">${TABS.map(t=>html`<button key=${t.id} class="tab" role="tab" aria-selected=${tab===t.id} onClick=${()=>go(t.id)}>${t.name}</button>`)}</div>
    ${tab==='terrain'?html`<${TerrainTab}/>`:html`<${RocksTab}/>`}
  </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>

</body></html>
